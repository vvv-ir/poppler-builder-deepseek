name: Build Poppler with self-built OSXCross
on:
  push:
  workflow_dispatch:
jobs:
  build-poppler:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git make cmake clang patch wget xz-utils \
            libxml2-dev libssl-dev build-essential autoconf libtool \
            ninja-build pkg-config libfontconfig1-dev libcairo2-dev \
            libjpeg-dev libtiff-dev libpng-dev

      - name: Clone OSXCross
        run: git clone https://github.com/tpoechtrager/osxcross.git

      - name: Download MacOSX10.13.sdk
        run: |
          mkdir -p osxcross/tarballs
          wget -O osxcross/tarballs/MacOSX10.13.sdk.tar.xz \
            https://github.com/phracker/MacOSX-SDKs/releases/download/10.13/MacOSX10.13.sdk.tar.xz

      - name: Build OSXCross
        run: |
          cd osxcross
          UNATTENDED=1 ./build.sh

      - name: Add OSXCross to PATH
        run: echo "$(pwd)/osxcross/target/bin" >> $GITHUB_PATH

      - name: Download Poppler source
        run: |
          wget https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
          tar -xf poppler-24.08.0.tar.xz
          mv poppler-24.08.0 poppler-source

      - name: Configure CMake
        run: |
          mkdir build && cd build
          SDK_PATH=$(find ../osxcross -name "MacOSX*.sdk" -type d | head -1)
          if [ -z "$SDK_PATH" ]; then
            echo "Error: SDK not found"
            exit 1
          fi
          echo "Using SDK: $SDK_PATH"
          cmake ../poppler-source \
            -DCMAKE_C_COMPILER=o64-clang \
            -DCMAKE_CXX_COMPILER=o64-clang++ \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_SYSROOT="$SDK_PATH" \
            -DBUILD_GTK_TESTS=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_OPENSSL=OFF

      - name: Build Poppler
        run: |
          cd build
          make -j$(nproc)

      - name: Prepare binaries
        run: |
          mkdir poppler-binaries
          cp build/utils/pdftoppm poppler-binaries/
          cp build/utils/pdftotext poppler-binaries/
          cp build/utils/pdfinfo poppler-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poppler-high-sierra
          path: poppler-binaries
