name: Build Poppler for High Sierra on Ubuntu
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libfontconfig1-dev libcairo2-dev libjpeg-dev \
            libtiff-dev libpng-dev autoconf libtool

      - name: Setup OSXCross
        uses: mbround18/setup-osxcross@v1
        with:
          osx-version: "10.13"

      - name: Build Freetype for macOS
        run: |
          export PATH="/home/runner/work/_actions/mbround18/setup-osxcross/v1/osxcross/target/bin:$PATH"
          wget https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar -xzf freetype-2.13.2.tar.gz
          cd freetype-2.13.2
          ./configure \
            --host=x86_64-apple-darwin17 \
            --prefix=$HOME/freetype-mac \
            CC=o64-clang CXX=o64-clang++
          make
          make install

      - name: Download Poppler source
        run: |
          wget https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
          tar -xf poppler-24.08.0.tar.xz
          mv poppler-24.08.0 poppler-source

      - name: Configure CMake
        run: |
          mkdir build && cd build
          SDK_PATH=$(find /home/runner/work/_actions/mbround18/setup-osxcross/v1/osxcross -name "MacOSX*.sdk" -type d | head -1)
          echo "Using SDK: $SDK_PATH"
          cmake ../poppler-source \
            -DCMAKE_C_COMPILER=o64-clang \
            -DCMAKE_CXX_COMPILER=o64-clang++ \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_SYSROOT="$SDK_PATH" \
            -DFREETYPE_INCLUDE_DIRS=$HOME/freetype-mac/include/freetype2 \
            -DFREETYPE_LIBRARY=$HOME/freetype-mac/lib/libfreetype.a \
            -DBUILD_GTK_TESTS=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_OPENSSL=OFF \
            -DENABLE_NSS3=OFF

      - name: Build Poppler
        run: |
          cd build
          make -j$(nproc)

      - name: Prepare binaries
        run: |
          mkdir poppler-binaries
          cp build/utils/pdftoppm poppler-binaries/
          cp build/utils/pdftotext poppler-binaries/
          cp build/utils/pdfinfo poppler-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poppler-high-sierra
          path: poppler-binaries
