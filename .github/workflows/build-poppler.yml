name: Build Poppler for High Sierra
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/crazy-max/osxcross:latest
    steps:
      - name: Install Poppler build dependencies
        run: |
          apt-get update
          apt-get install -y wget cmake ninja-build pkg-config \
            libfontconfig1-dev libcairo2-dev libjpeg-dev \
            libtiff-dev libpng-dev
      - name: Download Poppler source
        run: |
          wget https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
          tar -xf poppler-24.08.0.tar.xz
          mv poppler-24.08.0 poppler-source
      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake ../poppler-source \
            -DCMAKE_C_COMPILER=o64-clang \
            -DCMAKE_CXX_COMPILER=o64-clang++ \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_GTK_TESTS=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_OPENSSL=OFF
      - name: Build Poppler
        run: |
          cd build
          make -j$(nproc)
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: poppler-high-sierra
          path: build/utils/pdftoppm build/utils/pdftotext build/utils/pdfinfo
