name: Build Poppler with Isolated OSXCross (No Tests)
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET_HOST: x86_64-apple-darwin17
      MACOSX_DEPLOYMENT_TARGET: 10.13
      DEPS_DIR: ${{ github.workspace }}/deps
      OSXCROSS_ROOT: ${{ github.workspace }}/osxcross
      PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig

    steps:
      - name: Download OSXCross from Release
        run: |
          gh release download osxcross-latest \
            --repo "vvv-ir/osxcross_deepseek_way" \
            --pattern "osxcross-toolchain.tar.gz" \
            --output "./osxcross-toolchain.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OSXCross
        run: |
          mkdir -p $OSXCROSS_ROOT
          tar -xzf osxcross-toolchain.tar.gz -C $OSXCROSS_ROOT
          echo "$OSXCROSS_ROOT/bin" >> $GITHUB_PATH

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool

      - name: Create deps directory
        run: |
          mkdir -p $DEPS_DIR/lib $DEPS_DIR/include
          echo "PKG_CONFIG_PATH=$DEPS_DIR/lib/pkgconfig" >> $GITHUB_ENV

      - name: Create CMake toolchain file
        run: |
          cat > ${{ github.workspace }}/toolchain.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Darwin)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_OSX_DEPLOYMENT_TARGET $MACOSX_DEPLOYMENT_TARGET)
          set(CMAKE_C_COMPILER $OSXCROSS_ROOT/bin/o64-clang)
          set(CMAKE_CXX_COMPILER $OSXCROSS_ROOT/bin/o64-clang++)
          set(CMAKE_FIND_ROOT_PATH $DEPS_DIR)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      # ========== Сборка зависимостей ==========
      # zlib (автотулсы, тестов нет)
      - name: Build zlib
        run: |
          wget https://zlib.net/fossils/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz && cd zlib-1.3.1
          ./configure --prefix=$DEPS_DIR --static
          make -j$(nproc) && make install

      # libpng (CMake, отключаем всё лишнее)
      - name: Build libpng
        run: |
          wget https://downloads.sourceforge.net/project/libpng/libpng16/1.6.43/libpng-1.6.43.tar.gz
          tar -xzf libpng-1.6.43.tar.gz && cd libpng-1.6.43
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DPNG_SHARED=OFF \
            -DPNG_TESTS=OFF \
            -DPNG_TOOLS=OFF \
            -DPNG_EXECUTABLES=OFF \
            -DPNG_BUILD_ZLIB=OFF
          make -j$(nproc) && make install

      # libjpeg-turbo (CMake)
      - name: Build libjpeg-turbo
        run: |
          wget https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/3.0.2.tar.gz
          tar -xzf 3.0.2.tar.gz && cd libjpeg-turbo-3.0.2
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DENABLE_SHARED=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_JAVA=OFF \
            -DWITH_JPEG8=ON
          make -j$(nproc) && make install

      # libtiff (CMake)
      - name: Build libtiff
        run: |
          wget https://download.osgeo.org/libtiff/tiff-4.6.0.tar.gz
          tar -xzf tiff-4.6.0.tar.gz && cd tiff-4.6.0
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DBUILD_SHARED_LIBS=OFF \
            -Dtiff-tools=OFF \
            -Dtiff-tests=OFF \
            -Dtiff-contrib=OFF
          make -j$(nproc) && make install

      # freetype (autotools)
      - name: Build freetype
        run: |
          wget https://download.savannah.gnu.org/releases/freetype/freetype-2.13.2.tar.gz
          tar -xzf freetype-2.13.2.tar.gz && cd freetype-2.13.2
          ./configure --host=$TARGET_HOST --prefix=$DEPS_DIR --disable-shared \
            --without-bzip2 --without-png --without-harfbuzz --without-brotli
          make -j$(nproc) && make install

      # fontconfig (autotools)
      - name: Build fontconfig
        run: |
          wget https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.15.0.tar.gz
          tar -xzf fontconfig-2.15.0.tar.gz && cd fontconfig-2.15.0
          mkdir -p $DEPS_DIR/etc/fonts && touch $DEPS_DIR/etc/fonts/fonts.conf
          ./configure --host=$TARGET_HOST --prefix=$DEPS_DIR --disable-shared \
            --with-arch=x86_64 --with-expat=no --disable-docs --disable-tests
          make -j$(nproc) && make install

      # pixman (autotools)
      - name: Build pixman
        run: |
          wget https://cairographics.org/releases/pixman-0.42.2.tar.gz
          tar -xzf pixman-0.42.2.tar.gz && cd pixman-0.42.2
          ./configure --host=$TARGET_HOST --prefix=$DEPS_DIR --disable-shared \
            --disable-gtk --disable-libpng --disable-demos
          make -j$(nproc) && make install

      # cairo (autotools)
      - name: Build cairo
        run: |
          wget https://cairographics.org/releases/cairo-1.18.0.tar.xz
          tar -xf cairo-1.18.0.tar.xz && cd cairo-1.18.0
          ./configure --host=$TARGET_HOST --prefix=$DEPS_DIR --disable-shared \
            --enable-xlib=no --enable-xcb=no --enable-qt=no --enable-gtk-doc=no \
            --disable-trace --disable-svg --disable-ps --disable-pdf
          make -j$(nproc) && make install

      # openjpeg (CMake)
      - name: Build openjpeg
        run: |
          wget https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.2.tar.gz
          tar -xzf v2.5.2.tar.gz && cd openjpeg-2.5.2
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_CODEC=OFF
          make -j$(nproc) && make install

      # ========== Сборка Poppler ==========
      - name: Download Poppler source
        run: |
          wget https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
          tar -xf poppler-24.08.0.tar.xz
          mv poppler-24.08.0 poppler-source

      - name: Configure CMake for Poppler
        run: |
          mkdir build && cd build
          cmake ../poppler-source \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$DEPS_DIR \
            -DCMAKE_PREFIX_PATH=$DEPS_DIR \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_GTK_DOC=OFF \
            -DENABLE_LIBOPENJPEG=openjpeg2 \
            -DBUILD_GTK_TESTS=OFF \
            -DENABLE_CPP=ON \
            -DENABLE_GLIB=OFF

      - name: Build Poppler
        run: |
          cd build
          make -j$(nproc)

      - name: Prepare binaries
        run: |
          mkdir poppler-binaries
          cp build/utils/pdftoppm poppler-binaries/
          cp build/utils/pdftotext poppler-binaries/
          cp build/utils/pdfinfo poppler-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poppler-high-sierra
          path: poppler-binaries
