name: Build Poppler using OSXCross from Release

on:
  push: 
  workflow_dispatch:

jobs:
  build-poppler:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачать OSXCross из релиза через gh CLI
      - name: Download OSXCross from Release
        run: |
          gh release download osxcross-latest \
            --repo "vvv-ir/osxcross_deepseek_way" \
            --pattern "osxcross-toolchain.tar.gz" \
            --output "./osxcross-toolchain.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 2: Распаковать OSXCross в /usr/local/osxcross
      - name: Extract OSXCross
        run: |
          sudo mkdir -p /usr/local/osxcross
          sudo tar -xzf osxcross-toolchain.tar.gz -C /usr/local/osxcross
          echo "/usr/local/osxcross/bin" >> $GITHUB_PATH

      # Шаг 3: Установить недостающие библиотеки для линковщика OSXCross
      - name: Install OSXCross dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxar-dev libssl-dev

      # Шаг 4: Проверить компилятор
      - name: Verify compiler
        run: |
          o64-clang --version
          # Найти путь к SDK внутри OSXCross
          export SDKROOT=$(xcrun --show-sdk-path 2>/dev/null || echo "/usr/local/osxcross/SDK/MacOSX10.13.sdk")
          echo "SDKROOT=$SDKROOT"
          test -d "$SDKROOT" || (echo "SDK not found at $SDKROOT" && exit 1)

      # Шаг 5: Установить зависимости сборки Poppler
      - name: Install build dependencies
        run: |
          sudo apt-get install -y cmake ninja-build pkg-config \
            libfontconfig1-dev libcairo2-dev libjpeg-dev \
            libtiff-dev libpng-dev

      # Шаг 6: Скачать исходники Poppler
      - name: Download Poppler source
        run: |
          wget https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
          tar -xf poppler-24.08.0.tar.xz
          mv poppler-24.08.0 poppler-source

      # Шаг 7: Настроить CMake (явно указать sysroot)
      - name: Configure CMake
        run: |
          mkdir build && cd build
          # Определяем путь к SDK (обычно /usr/local/osxcross/SDK/MacOSX10.13.sdk)
          SDK_PATH="/usr/local/osxcross/SDK/MacOSX10.13.sdk"
          if [ ! -d "$SDK_PATH" ]; then
            echo "SDK not found at $SDK_PATH, searching..."
            SDK_PATH=$(find /usr/local/osxcross -name "MacOSX*.sdk" -type d | head -1)
          fi
          echo "Using SDK: $SDK_PATH"
          cmake ../poppler-source \
            -DCMAKE_C_COMPILER=o64-clang \
            -DCMAKE_CXX_COMPILER=o64-clang++ \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_SYSROOT="$SDK_PATH" \
            -DBUILD_GTK_TESTS=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF

      # Шаг 8: Скомпилировать Poppler
      - name: Build Poppler
        run: |
          cd build
          make -j$(nproc)

      # Шаг 9: Подготовить бинарники
      - name: Prepare binaries
        run: |
          mkdir poppler-binaries
          cp build/utils/pdftoppm poppler-binaries/
          cp build/utils/pdftotext poppler-binaries/
          cp build/utils/pdfinfo poppler-binaries/

      # Шаг 10: Сохранить результат
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poppler-high-sierra
          path: poppler-binaries
