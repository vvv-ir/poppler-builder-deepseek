name: Build Poppler using OSXCross from Release

on:
  push: 
  workflow_dispatch:

jobs:
  build-poppler:
    runs-on: ubuntu-latest   # ubuntu 24.04

    steps:
      - name: Download OSXCross from Release
        run: |
          gh release download osxcross-latest \
            --repo "vvv-ir/osxcross_deepseek_way" \
            --pattern "osxcross-toolchain.tar.gz" \
            --output "./osxcross-toolchain.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OSXCross
        run: |
          sudo mkdir -p /usr/local/osxcross
          sudo tar -xzf osxcross-toolchain.tar.gz -C /usr/local/osxcross
          echo "/usr/local/osxcross/bin" >> $GITHUB_PATH

      # Сборка libxar.so.1 из исходников (т.к. в Ubuntu 24.04 нет пакета)
      - name: Build libxar from source
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf libtool
          git clone https://github.com/mackyle/xar.git
          cd xar/xar
          ./autogen.sh
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig
          # Проверяем, что библиотека появилась
          ls -la /usr/lib/libxar* || echo "libxar not found"
          ldd /usr/local/osxcross/bin/x86_64-apple-darwin17-ld | grep xar || echo "xar linkage ok"

      - name: Verify compiler
        run: o64-clang --version

      - name: Install build dependencies for Poppler
        run: |
          sudo apt-get install -y cmake ninja-build pkg-config \
            libfontconfig1-dev libcairo2-dev libjpeg-dev \
            libtiff-dev libpng-dev

      - name: Download Poppler source
        run: |
          wget https://poppler.freedesktop.org/poppler-24.08.0.tar.xz
          tar -xf poppler-24.08.0.tar.xz
          mv poppler-24.08.0 poppler-source

      - name: Configure CMake
        run: |
          mkdir build && cd build
          SDK_PATH="/usr/local/osxcross/SDK/MacOSX10.13.sdk"
          if [ ! -d "$SDK_PATH" ]; then
            SDK_PATH=$(find /usr/local/osxcross -name "MacOSX*.sdk" -type d | head -1)
          fi
          echo "Using SDK: $SDK_PATH"
          cmake ../poppler-source \
            -DCMAKE_C_COMPILER=o64-clang \
            -DCMAKE_CXX_COMPILER=o64-clang++ \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_SYSROOT="$SDK_PATH" \
            -DBUILD_GTK_TESTS=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF

      - name: Build Poppler
        run: |
          cd build
          make -j$(nproc)

      - name: Prepare binaries
        run: |
          mkdir poppler-binaries
          cp build/utils/pdftoppm poppler-binaries/
          cp build/utils/pdftotext poppler-binaries/
          cp build/utils/pdfinfo poppler-binaries/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poppler-high-sierra
          path: poppler-binaries
